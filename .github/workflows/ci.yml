name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_test
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-prod
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REQUEST_ACCESS_EMAIL: matovu90@gmail.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_PRODUCT_BUCKET: ${{ secrets.S3_PRODUCT_BUCKET }}
      MOCK_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .env.test for vitest
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "APP_URL=$APP_URL"
            echo "REQUEST_ACCESS_EMAIL=$REQUEST_ACCESS_EMAIL"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_PRODUCT_BUCKET=$S3_PRODUCT_BUCKET"
            echo "MOCK_EMAILS=$MOCK_EMAILS"
          } > .env.test
      - name: Apply database migrations
        run: pnpm exec drizzle-kit push --force
      - name: Seed transaction categories
        run: pnpm exec tsx src/db/seed.ts
      - run: pnpm test

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_test
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-prod
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REQUEST_ACCESS_EMAIL: matovu90@gmail.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_PRODUCT_BUCKET: ${{ secrets.S3_PRODUCT_BUCKET }}
      MOCK_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      - name: Install Cypress binary
        run: pnpm exec cypress install
      - name: Write .env.local for dev server
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "APP_URL=$APP_URL"
            echo "REQUEST_ACCESS_EMAIL=$REQUEST_ACCESS_EMAIL"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_PRODUCT_BUCKET=$S3_PRODUCT_BUCKET"
            echo "MOCK_EMAILS=$MOCK_EMAILS"
          } > .env.local
      - name: Apply database migrations
        run: pnpm exec drizzle-kit push --force
      - name: Seed transaction categories
        run: pnpm exec tsx src/db/seed.ts
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: pnpm dev
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REQUEST_ACCESS_EMAIL: matovu90@gmail.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_PRODUCT_BUCKET: ${{ secrets.S3_PRODUCT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build

  workers-integration:
    name: Workers Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --config vitest.workers.config.ts src/__tests__/request-access-rate-limiter.integration.test.ts

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, e2e, workers-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REQUEST_ACCESS_EMAIL: matovu90@gmail.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_PRODUCT_BUCKET: ${{ secrets.S3_PRODUCT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec tsx scripts/migrate.ts
      - run: pnpm exec vite build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
